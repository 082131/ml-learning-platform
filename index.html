<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive lessons for machine learning, data, AI and inference engineering." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Learn ML</title>
    <script>
      // Set the theme before first paint so there is no flash. Mirrors src/lib/theme.ts.
      (function () {
        var pref = 'system';
        try {
          pref = JSON.parse(localStorage.getItem('mlp:v1') || '{}').theme || 'system';
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
