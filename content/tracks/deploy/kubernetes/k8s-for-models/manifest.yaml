apiVersion: apps/v1
kind: Deployment
metadata:
  name: digits-api
spec:
  replicas: {{replicas}}
  selector:
    matchLabels:
      app: digits-api
  template:
    metadata:
      labels:
        app: digits-api
    spec:
      tolerations: {{tolerations}}
      containers:
        - name: server
          image: digits-api:1
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: {{cpu}}
              memory: {{mem}}
              nvidia.com/gpu: {{gpu}}
            limits:
              memory: {{mem}}
              nvidia.com/gpu: {{gpu}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: digits-api
spec:
  selector:
    app: digits-api
  ports:
    - port: 80
      targetPort: 8000
