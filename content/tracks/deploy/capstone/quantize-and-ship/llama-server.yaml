# Reference manifests for the capstone: a llama.cpp server for one quantized GGUF file, with a rolling update
# that never drops below the current capacity and an autoscaler on CPU. Change MODEL_URL to your own file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels: { app: llm }
spec:
  replicas: 2
  selector:
    matchLabels: { app: llm }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: llm, model-version: "q4-k-m-v1" }
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.17.0
          env:
            - name: MODEL_URL
              value: "https://models.example.internal/tiny-chat/v1/model-Q4_K_M.gguf"
          command: ["sh", "-c", "curl -fsSL -o /models/model.gguf \"$MODEL_URL\""]
          volumeMounts:
            - { name: models, mountPath: /models }
      containers:
        - name: server
          image: ghcr.io/ggml-org/llama.cpp:server
          args: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080",
                 "-c", "4096", "--parallel", "2", "--threads", "2", "--metrics"]
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { memory: 3Gi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: llm
spec:
  selector: { app: llm }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: llm }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
